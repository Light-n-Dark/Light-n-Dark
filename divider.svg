<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 32" width="900" height="32" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#888" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#888" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#888" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pulse">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="1"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="40" y="15" width="820" height="2" fill="url(#line)"/>

  <!-- travelling pulse -->
  <circle cy="16" r="9" fill="url(#pulse)">
    <animate attributeName="cx" values="60;840;60" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- centre orb -->
  <rect x="410" y="0" width="80" height="32" fill="#0d1117" opacity="0"/>
  <g transform="translate(450,16)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      <circle r="9" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
      <path d="M0,-9 A9,9 0 0 1 0,9 A4.5,4.5 0 0 1 0,0 A4.5,4.5 0 0 0 0,-9 Z" fill="#050505"/>
      <circle cy="-4.5" r="1.4" fill="#050505"/>
      <circle cy="4.5" r="1.4" fill="#ffffff"/>
    </g>
  </g>
</svg>
