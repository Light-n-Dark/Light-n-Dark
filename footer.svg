<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170" role="img" aria-label="We are not offline. We are just classified." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="typed">
      <rect x="0" y="30" width="0" height="50">
        <animate attributeName="width" values="0;0;560;560;560" keyTimes="0;0.05;0.45;0.92;1" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="x" values="170;170;170;170;170" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="170" fill="#0d1117"/>

  <!-- wave layers (each shifts by one full period, 900px, so the loop is seamless) -->
  <g>
    <path d="M0 110 Q225 70 450 110 T900 110 T1350 110 T1800 110 V170 H0 Z" fill="#ffffff" opacity="0.04">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="26s" repeatCount="indefinite"/>
    </path>
    <path d="M0 125 Q225 95 450 125 T900 125 T1350 125 T1800 125 V170 H0 Z" fill="#ffffff" opacity="0.07">
      <animateTransform attributeName="transform" type="translate" from="-900 0" to="0 0" dur="19s" repeatCount="indefinite"/>
    </path>
    <path d="M0 140 Q225 118 450 140 T900 140 T1350 140 T1800 140 V170 H0 Z" fill="#00ff9c" opacity="0.10">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="13s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- typed line -->
  <g clip-path="url(#typed)">
    <text x="170" y="62" font-family="'Courier New',Courier,monospace" font-size="16" letter-spacing="3" fill="#c9d1d9" textLength="560" lengthAdjust="spacing">WE ARE NOT OFFLINE. WE ARE JUST CLASSIFIED.</text>
  </g>

  <!-- cursor rides the typing edge, then blinks in place -->
  <rect x="170" y="44" width="10" height="22" fill="#00ff9c">
    <animate attributeName="x" values="170;170;730;730;730" keyTimes="0;0.05;0.45;0.92;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
