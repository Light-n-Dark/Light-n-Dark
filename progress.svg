<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="900" height="130" role="img" aria-label="Build progress bar stuck at 99 percent" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fill" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00b36b"/>
      <stop offset="1" stop-color="#00ff9c"/>
    </linearGradient>
    <pattern id="stripes" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <animate attributeName="x" from="0" to="24" dur="1.6s" repeatCount="indefinite"/>
      <polygon points="0,24 12,0 24,0 12,24" fill="#ffffff" opacity="0.18"/>
    </pattern>
    <clipPath id="track"><rect x="40" y="52" width="820" height="24" rx="12"/></clipPath>
  </defs>

  <rect width="900" height="130" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="898" height="128" rx="13" fill="none" stroke="#30363d" stroke-width="2"/>

  <text x="40" y="38" font-family="'Courier New',Courier,monospace" font-size="14" letter-spacing="3" fill="#8b949e">FIRST RELEASE // BUILD PROGRESS</text>

  <!-- percentage labels (stepped) -->
  <g font-family="'Courier New',Courier,monospace" font-size="22" font-weight="700" fill="#00ff9c" text-anchor="end">
    <text x="860" y="38">0%<animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0;0" keyTimes="0;0.10;0.25;0.40;0.55;0.70" dur="14s" repeatCount="indefinite"/></text>
    <text x="860" y="38" opacity="0">12%<animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0" keyTimes="0;0.10;0.25;0.40;0.55;0.70" dur="14s" repeatCount="indefinite"/></text>
    <text x="860" y="38" opacity="0">37%<animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0" keyTimes="0;0.10;0.25;0.40;0.55;0.70" dur="14s" repeatCount="indefinite"/></text>
    <text x="860" y="38" opacity="0">58%<animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0" keyTimes="0;0.10;0.25;0.40;0.55;0.70" dur="14s" repeatCount="indefinite"/></text>
    <text x="860" y="38" opacity="0">81%<animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;1;0" keyTimes="0;0.10;0.25;0.40;0.55;0.70" dur="14s" repeatCount="indefinite"/></text>
    <text x="860" y="38" opacity="0">99%<animate attributeName="opacity" calcMode="discrete" values="0;0;0;0;0;1" keyTimes="0;0.10;0.25;0.40;0.55;0.70" dur="14s" repeatCount="indefinite"/></text>
  </g>

  <!-- track -->
  <rect x="40" y="52" width="820" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <g clip-path="url(#track)">
    <rect x="40" y="52" width="0" height="24" fill="url(#fill)">
      <animate attributeName="width" values="0;98;300;470;665;812;812" keyTimes="0;0.10;0.25;0.40;0.55;0.70;1" dur="14s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="52" width="0" height="24" fill="url(#stripes)">
      <animate attributeName="width" values="0;98;300;470;665;812;812" keyTimes="0;0.10;0.25;0.40;0.55;0.70;1" dur="14s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- snarky status line -->
  <g font-family="'Courier New',Courier,monospace" font-size="13" letter-spacing="1" fill="#8b949e">
    <text x="40" y="108">STATUS: SURE, WE'RE ALMOST THERE.
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.68;0.70;1" dur="14s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="108" opacity="0">STATUS: 99% DONE. THE LAST 1% IS 99% OF THE WORK.
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.69;0.72;1" dur="14s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
