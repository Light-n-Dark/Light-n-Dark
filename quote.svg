<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="BRO. HEAR ME OUT. - the sentence that ruins evenings">
  <defs>
    <radialGradient id="g" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="270" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="898" height="268" rx="13" fill="none" stroke="#30363d" stroke-width="2"/>
  <ellipse cx="450" cy="135" rx="420" ry="130" fill="url(#g)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- giant decorative quote marks -->
  <text x="40" y="150" font-family="Georgia,serif" font-size="170" fill="#ffffff" opacity="0.07">&#8220;</text>
  <text x="780" y="230" font-family="Georgia,serif" font-size="170" fill="#ffffff" opacity="0.07">&#8221;</text>

  <text x="450" y="38" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="13" letter-spacing="4" fill="#8b949e">THE SENTENCE THAT HAS RUINED MORE EVENINGS THAN WE CAN COUNT</text>

  <!-- BRO. (glitches) -->
  <g>
    <text x="450" y="112" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="68" font-weight="700" letter-spacing="8" fill="#ff2d55" opacity="0">BRO.
      <animate attributeName="opacity" values="0;0;0.8;0;0.6;0;0" keyTimes="0;0.20;0.21;0.23;0.24;0.27;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x" values="450;450;443;450;457;450;450" keyTimes="0;0.20;0.21;0.23;0.24;0.27;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="112" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="68" font-weight="700" letter-spacing="8" fill="#00e5ff" opacity="0">BRO.
      <animate attributeName="opacity" values="0;0;0.8;0;0.6;0;0" keyTimes="0;0.20;0.21;0.23;0.24;0.27;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x" values="450;450;457;450;443;450;450" keyTimes="0;0.20;0.21;0.23;0.24;0.27;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="112" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="68" font-weight="700" letter-spacing="8" fill="#ffffff" opacity="0">BRO.
      <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.08;0.12;0.95;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- HEAR ME OUT. -->
  <text x="450" y="188" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="56" font-weight="700" letter-spacing="6" fill="#00ff9c" opacity="0">HEAR ME OUT.
    <animate attributeName="opacity" values="0;0;0;1;1;1" keyTimes="0;0.25;0.30;0.36;0.95;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- the consequences -->
  <g font-family="'Courier New',Courier,monospace" font-size="15" letter-spacing="3" fill="#8b949e" text-anchor="middle">
    <text x="450" y="236" opacity="0">&#8212; DARK, 3:14 AM &#183; BROWSER TABS OPEN: 1
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.48;0.60;0.62;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="236" opacity="0">&#8212; DARK, 3:31 AM &#183; BROWSER TABS OPEN: 9
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.65;0.76;0.78;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="236" fill="#ff6b81" opacity="0">&#8212; LIGHT, 4:02 AM &#183; BROWSER TABS OPEN: 17 &#183; "WAIT, WHAT ARE WE BUILDING?"
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.78;0.82;0.97;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
