<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="Classified document with redacted project details" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="paper"><rect x="40" y="24" width="820" height="242" rx="6"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="900" height="290" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="898" height="288" rx="13" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- paper -->
  <rect x="40" y="24" width="820" height="242" rx="6" fill="#ece7da" filter="url(#shadow)"/>

  <g font-family="'Courier New',Courier,monospace" clip-path="url(#paper)">
    <text x="70" y="62" font-size="15" font-weight="700" letter-spacing="2" fill="#222">L&amp;D // RESTRICTED ARCHIVE // EYES ONLY</text>
    <rect x="70" y="74" width="760" height="2" fill="#222" opacity="0.7"/>

    <!-- labels -->
    <g font-size="17" font-weight="700" fill="#1a1a1a">
      <text x="70" y="112">PROJECT:</text>
      <text x="70" y="148">PURPOSE:</text>
      <text x="70" y="184">RELEASE DATE:</text>
      <text x="70" y="220">FOUNDERS:</text>
      <text x="70" y="256">FACES:</text>
    </g>

    <!-- values hiding under the bars -->
    <text x="280" y="112" font-size="17" font-weight="700" fill="#b00020">NICE TRY.</text>
    <text x="280" y="148" font-size="17" fill="#1a1a1a">WAIT AND SEE</text>
    <text x="280" y="184" font-size="17" fill="#1a1a1a">NOT MAKING THINGS UP TODAY</text>
    <text x="280" y="220" font-size="17" fill="#1a1a1a">TWO. ALLEGEDLY.</text>
    <text x="280" y="256" font-size="17" fill="#1a1a1a">ABSOLUTELY NOT</text>

    <!-- bars: PROJECT slides away to tease, then slams back -->
    <rect x="276" y="94" width="300" height="24" fill="#0a0a0a">
      <animate attributeName="x" values="276;276;620;620;276;276" keyTimes="0;0.50;0.58;0.78;0.84;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="276" y="130" width="420" height="24" fill="#0a0a0a"/>
    <rect x="276" y="238" width="320" height="24" fill="#0a0a0a"/>
  </g>

  <!-- CLASSIFIED stamp -->
  <g transform="translate(690,170) rotate(-12)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="4;1;1;1;4" keyTimes="0;0.08;0.86;0.94;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.92;0.92;0;0" keyTimes="0;0.08;0.86;0.94;1" dur="12s" repeatCount="indefinite"/>
      <rect x="-150" y="-40" width="300" height="80" rx="6" fill="none" stroke="#c4122f" stroke-width="5"/>
      <rect x="-142" y="-32" width="284" height="64" rx="3" fill="none" stroke="#c4122f" stroke-width="1.5"/>
      <text x="0" y="15" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="46" font-weight="700" letter-spacing="5" fill="#c4122f">CLASSIFIED</text>
    </g>
  </g>
</svg>
